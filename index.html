<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraEx — Premium Currency Exchange</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div id="connection-banner" class="connection-banner hidden">
        <i class="fa-solid fa-triangle-exclamation"></i> No internet connection. Using cached rates.
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon"><i class="fa-solid fa-chart-line"></i></div>
                <span class="logo-text">Aura<span class="gradient-text">Ex</span></span>
            </div>
            <div class="market-status">
                <span class="pulse-dot"></span>
                <span>Market Live</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Converter Card -->
            <section class="converter-card">
                <div class="card-header">
                    <h2>Currency Converter</h2>
                    <span class="last-updated" id="last-updated"><i class="fa-solid fa-clock-rotate-left"></i> Syncing...</span>
                </div>

                <div class="converter-body">
                    <!-- Section 1: From Currency -->
                    <div class="conversion-section">
                        <div class="section-top">
                            <span class="section-title">From Amount</span>
                            <select id="from-currency" class="currency-select"></select>
                        </div>
                        <div class="section-bottom">
                            <input type="number" id="amount" value="100" min="0" step="any" placeholder="0.00">
                        </div>
                    </div>

                    <!-- Swap Divider -->
                    <div class="swap-container">
                        <button id="swap-btn" class="swap-btn" title="Swap currencies">
                            <i class="fa-solid fa-arrow-right-arrow-left"></i>
                        </button>
                    </div>

                    <!-- Section 2: To Currency -->
                    <div class="conversion-section">
                        <div class="section-top">
                            <span class="section-title">Converted To</span>
                            <select id="to-currency" class="currency-select"></select>
                        </div>
                        <div class="section-bottom">
                            <input type="text" id="converted-amount" readonly placeholder="0.00">
                        </div>
                    </div>

                    <!-- Meta Info -->
                    <div class="conversion-meta">
                        <div class="rate-display">
                            <i class="fa-solid fa-info-circle"></i>
                            <span id="rate-text">Loading rate...</span>
                        </div>
                        <button id="copy-btn" class="copy-btn">
                            <i class="fa-regular fa-copy"></i> Copy Result
                        </button>
                    </div>
                </div>
            </section>

            <!-- Popular Rates Section -->
            <section class="popular-section">
                <div class="section-header">
                    <h3><i class="fa-solid fa-fire"></i> Market Rates (vs <span id="base-currency-label">USD</span>)</h3>
                    <div class="popular-filter">
                        <button class="filter-chip active" data-base="USD">USD</button>
                        <button class="filter-chip" data-base="EUR">EUR</button>
                        <button class="filter-chip" data-base="IQD">IQD</button>
                    </div>
                </div>
                <div class="popular-grid" id="popular-grid"></div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>&copy; 2026 AuraEx Financial Services. All rights reserved.</p>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <i class="fa-solid fa-circle-check"></i> Copied to clipboard!
    </div>

    <script src="script.js"></script>
</body>
</html>
